name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      # `uv pip sync` requires a target environment. Create a venv and install
      # exactly the pinned dependencies from requirements.lock, then invoke the
      # tools directly from that venv. Using `uv run` here would instead resolve
      # the unpinned deps declared in pyproject.toml and ignore the lock file.
      - name: Create venv and sync locked dependencies
        run: |
          uv venv
          uv pip sync requirements.lock

      - name: Install Playwright Browsers
        run: |
          .venv/bin/playwright install chromium

      - name: Run Ruff Linter
        run: |
          .venv/bin/ruff check .

      - name: Run Mypy Type Checker
        run: |
          .venv/bin/mypy ozbargain/

      - name: Run Tests
        run: |
          .venv/bin/pytest
