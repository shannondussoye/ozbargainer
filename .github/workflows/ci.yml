name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      # setup-uv creates a .venv and exports VIRTUAL_ENV, so `uv pip sync`
      # installs the pinned requirements.lock into it. Invoke the tools from
      # that venv directly so the locked versions are used — `uv run` would
      # additionally resolve pyproject.toml's unpinned dependencies.
      - name: Sync locked dependencies
        run: |
          uv pip sync requirements.lock

      - name: Install Playwright Browsers
        run: |
          .venv/bin/playwright install chromium

      - name: Run Ruff Linter
        run: |
          .venv/bin/ruff check .

      - name: Run Mypy Type Checker
        run: |
          .venv/bin/mypy ozbargain/

      - name: Run Tests
        run: |
          .venv/bin/pytest
